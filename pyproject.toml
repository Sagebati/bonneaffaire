[project]
name = "bonneaffaire"
version = "0.1.0"
description = "Search second-hand and retail marketplaces in one place."
authors = [
    { name = "sabati", email = "samublaise@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.28.0",
]

[project.scripts]
bonneaffaire = "bonneaffaire.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not canary'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "canary: live tests that hit real Providers; excluded by default, run with `uv run pytest -m canary`",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
